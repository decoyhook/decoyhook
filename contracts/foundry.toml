[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
fuzz = { runs = 1024 }

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.10.0"
v4-core = { version = "4.0.0", git = "https://github.com/Uniswap/v4-core.git", tag = "v4.0.0" }
solmate = "6.8.0"
