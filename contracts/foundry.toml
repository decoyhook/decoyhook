[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
fuzz = { runs = 1024 }

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[soldeer]
remappings_generate = true
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false

[dependencies]
forge-std = "1.10.0"
