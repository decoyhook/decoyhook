name: Feature request
description: Propose a change or a new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. A clear problem makes it easier to agree on the right fix.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Contracts (contracts)
        - Website or API (decoyhook.com)
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, and how it would work.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security and trust impact
      description: Would this change what a swap pays, who receives fees, what a pool's rules allow after it opens, or what the site asks a wallet to sign? Write "None" if it does not.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they fall short.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues and this has not been proposed.
          required: true
